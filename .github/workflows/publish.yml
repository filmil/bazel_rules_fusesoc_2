# Publishes a release to filmil/bazel-registry. Called from tag-and-release.yml
# after the release exists, and by hand for a tag that is already released.
name: "Publish to my Bazel registry"

on:
  workflow_call:
    secrets:
      BCR_PUBLISH_TOKEN:
        required: true
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish"
        required: true
        type: string

jobs:
  publish:
    uses: "bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0"
    with:
      tag_name: ${{ inputs.tag_name }}
      registry: filmil/bazel-registry
      registry_fork: filmil/bazel-registry
      # No attestation here; publish-bcr.yml is the one publish that attests.
      # See the comment on the publish job in tag-and-release.yml.
      attest: false
      draft: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
