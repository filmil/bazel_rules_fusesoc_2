# Tags a release from the top of main, builds the source archive and the two
# binary archives, attests the source archive, and publishes the module to
# filmil/bazel-registry and then to the Bazel Central Registry.
#
# Runs once a month, and by hand. Nothing happens when main is already
# released: the `check` job asks, and every other job hangs off its answer.
name: Tag and Release

env:
  ZIP_PACKAGE: "//third_party/fusesoc"
  BINARY_NAME: "bazel-bin/third_party/fusesoc/fusesoc-bin"
  ZIP_PACKAGE_2: "//bin/edalize_read"
  BINARY_NAME_2: "bazel-bin/bin/edalize_read/edalize_read-bin"

on:
  schedule:
    - cron: '0 0 26 * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: "Release even when nothing has changed since the last tag"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: `git describe` needs both.
          fetch-depth: 0
      - name: Look for commits since the last release
        id: changes
        run: |
          set -o errexit -o nounset -o pipefail
          if [ "${{ inputs.force_release }}" = "true" ]; then
            echo "Forced; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          latest="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "${latest}" ]; then
            echo "No tag yet; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "${latest}")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is already released as ${latest}. Nothing to release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "$(git rev-list --count "${latest}"..HEAD) commit(s) since ${latest}; releasing."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  # Computes the next version from the conventional-commit titles since the
  # last tag, and pushes the tag. release_ruleset.yaml below checks the tag
  # out, so it has to exist first.
  tag:
    needs: check
    if: ${{ needs.check.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: ${{ inputs.force_release && 'patch' || 'false' }}

  # Creates the GitHub release with the source archive from release_prep.sh,
  # runs `bazel test //...`, and attests the archive with the builder id that
  # the Bazel Central Registry's presubmit verifies.
  release:
    needs: tag
    if: ${{ needs.tag.outputs.tag_name != '' }}
    permissions:
      contents: write      # upload release files
      id-token: write      # attest provenance
      attestations: write  # attest provenance
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
      release_files: bazel_rules_fusesoc_2-${{ needs.tag.outputs.tag_name }}.zip
      prerelease: false

  # The fusesoc and edalize_read binaries. fusesoc_repo downloads these by
  # URL and checksum at fetch time, so they have to be on the release before
  # anything tries to use the module, which the publish presubmits do.
  binaries:
    needs: [tag, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: ["amd64"]
        os: ["linux"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag_name }}
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: "Build binaries for ${{ matrix.os }}_${{ matrix.arch }}"
        run: |
          bazel build \
            --${ZIP_PACKAGE}:name_part_from_command_line=${{ matrix.os }}-${{ matrix.arch }} \
            ${ZIP_PACKAGE}:zip ${ZIP_PACKAGE_2}:zip
      - name: "Upload ${{ matrix.os }}_${{ matrix.arch }} binaries to the release"
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ needs.tag.outputs.tag_name }}
          allowUpdates: true
          # Add assets; keep the name and notes release_ruleset.yaml wrote.
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          artifacts: "${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ matrix.arch }}.zip,${{ env.BINARY_NAME_2 }}-${{ matrix.os }}-${{ matrix.arch }}.zip"

  # filmil/bazel-registry first. It does not attest: exactly one publish may,
  # because every attesting publish uploads MODULE.bazel.intoto.jsonl and
  # source.json.intoto.jsonl to the release under those fixed names, and a
  # second one overwrites what the first registry entry recorded.
  publish:
    needs: [tag, binaries]
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets: inherit

  # The Bazel Central Registry second, and this is the one that attests.
  publish-bcr:
    needs: [tag, publish]
    uses: ./.github/workflows/publish-bcr.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag_name }}
    secrets: inherit
